name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libudev-dev libasound2-dev
      - name: Gates
        run: cargo xtask ci
      - name: UI tests (headless, software renderer)
        if: runner.os == 'Linux'
        run: cargo test -p template-ui-egui
        env:
          WGPU_BACKEND: gl
          LIBGL_ALWAYS_SOFTWARE: 1
